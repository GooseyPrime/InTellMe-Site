<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t">
  <title id="t">A product with a wall of five-star reviews, most of them traced back by lines to a single cluster of sites, with only a few coming from separate customers</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1612"/>
      <stop offset="1" stop-color="#110F0D"/>
    </linearGradient>
    <symbol id="star" viewBox="-10 -10 20 20">
      <path d="M0,-9 L2.6,-3 L9,-2.8 L4,1.4 L5.6,8 L0,4.4 L-5.6,8 L-4,1.4 L-9,-2.8 L-2.6,-3 Z" fill="#C6A36A"/>
    </symbol>
    <g id="card">
      <rect width="96" height="30" rx="5" fill="#1C1814" stroke="#3A3228"/>
      <use href="#star" x="8" y="7" width="9" height="9"/>
      <use href="#star" x="19" y="7" width="9" height="9"/>
      <use href="#star" x="30" y="7" width="9" height="9"/>
      <use href="#star" x="41" y="7" width="9" height="9"/>
      <use href="#star" x="52" y="7" width="9" height="9"/>
      <rect x="8" y="20" width="70" height="4" rx="2" fill="#6B6156"/>
    </g>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <g fill="none" stroke="#2A241C" stroke-width="1">
    <path d="M0 100 H600 M0 200 H600 M0 300 H600 M150 0 V400 M300 0 V400 M450 0 V400" opacity=".6"/>
  </g>

  <!-- Phone -->
  <g transform="translate(34 40)">
    <rect width="150" height="320" rx="22" fill="#1C1814" stroke="#3A3228" stroke-width="1.5"/>
    <rect x="55" y="12" width="40" height="5" rx="2.5" fill="#3A3228"/>
    <rect x="18" y="32" width="114" height="78" rx="8" fill="#2A241C"/>
    <path d="M52 92 l16 -26 l14 18 l10 -10 l16 18 z" fill="#3A3228"/>
    <circle cx="104" cy="54" r="7" fill="#3A3228"/>
    <rect x="18" y="120" width="80" height="7" rx="3" fill="#D6CFC3"/>
    <g transform="translate(18 136)">
      <use href="#star" x="0" y="0" width="14" height="14"/>
      <use href="#star" x="16" y="0" width="14" height="14"/>
      <use href="#star" x="32" y="0" width="14" height="14"/>
      <use href="#star" x="48" y="0" width="14" height="14"/>
      <use href="#star" x="64" y="0" width="14" height="14"/>
    </g>
    <rect x="18" y="170" width="114" height="36" rx="8" fill="none" stroke="#C6A36A" stroke-width="1.6"/>
    <rect x="38" y="185" width="74" height="6" rx="3" fill="#C6A36A"/>
    <rect x="18" y="222" width="114" height="4" rx="2" fill="#3A3228"/>
    <rect x="18" y="234" width="90" height="4" rx="2" fill="#3A3228"/>
    <rect x="18" y="246" width="104" height="4" rx="2" fill="#3A3228"/>
  </g>

  <!-- Review cards -->
  <g transform="translate(214 34)">
    <use href="#card" x="0" y="0"/>
    <use href="#card" x="0" y="40"/>
    <use href="#card" x="0" y="80"/>
    <use href="#card" x="0" y="120"/>
    <use href="#card" x="0" y="160"/>
    <use href="#card" x="0" y="200"/>
    <use href="#card" x="0" y="240"/>
    <use href="#card" x="0" y="280"/>
  </g>

  <!-- Lines to single cluster -->
  <g fill="none" stroke="#E5484D" stroke-width="1.3" opacity=".85">
    <path d="M312 49 C380 49 400 150 452 168"/>
    <path d="M312 89 C380 89 400 160 452 172"/>
    <path d="M312 129 C380 129 410 170 452 176"/>
    <path d="M312 169 C380 169 410 180 452 180"/>
    <path d="M312 209 C380 209 410 188 452 184"/>
    <path d="M312 289 C380 289 400 200 452 190"/>
    <path d="M312 329 C390 329 410 210 456 196"/>
  </g>
  <!-- Cluster: one origin -->
  <g transform="translate(488 178)">
    <circle r="40" fill="#1C1814" stroke="#E5484D" stroke-width="1.8"/>
    <circle cx="-12" cy="-10" r="7" fill="#E5484D" opacity=".85"/>
    <circle cx="10" cy="-12" r="7" fill="#E5484D" opacity=".85"/>
    <circle cx="0" cy="8" r="7" fill="#E5484D" opacity=".85"/>
    <circle cx="-16" cy="12" r="5" fill="#E5484D" opacity=".6"/>
    <circle cx="16" cy="10" r="5" fill="#E5484D" opacity=".6"/>
  </g>
  <!-- Separate customers -->
  <g fill="none" stroke="#D6CFC3" stroke-width="1.3">
    <path d="M312 249 C380 249 420 280 470 292"/>
  </g>
  <g transform="translate(486 294)">
    <circle r="14" fill="#1C1814" stroke="#D6CFC3" stroke-width="1.6"/>
    <circle cx="0" cy="-3" r="4" fill="none" stroke="#D6CFC3" stroke-width="1.4"/>
    <path d="M-7 8 q7 -8 14 0" fill="none" stroke="#D6CFC3" stroke-width="1.4"/>
  </g>
  <!-- Flag -->
  <g transform="translate(530 88)">
    <path d="M0 0 V48" stroke="#C6A36A" stroke-width="2"/>
    <path d="M0 2 H30 L22 12 L30 22 H0 Z" fill="#C6A36A"/>
  </g>
</svg>
