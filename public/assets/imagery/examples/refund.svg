<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t">
  <title id="t">An AI support chat about to issue a refund, checked against an outdated policy page and a current one that disagree, then handed to a person</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1612"/>
      <stop offset="1" stop-color="#110F0D"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C6A36A"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <g fill="none" stroke="#2A241C" stroke-width="1">
    <path d="M0 100 H600 M0 200 H600 M0 300 H600 M150 0 V400 M300 0 V400 M450 0 V400" opacity=".6"/>
  </g>

  <!-- Chat window -->
  <g transform="translate(34 70)">
    <rect width="170" height="240" rx="10" fill="#1C1814" stroke="#3A3228"/>
    <circle cx="22" cy="22" r="9" fill="none" stroke="#C6A36A" stroke-width="1.6"/>
    <path d="M17 22 h10 M22 17 v10" stroke="#C6A36A" stroke-width="1.6"/>
    <rect x="40" y="16" width="70" height="6" rx="3" fill="#3A3228"/>
    <rect x="16" y="50" width="120" height="34" rx="8" fill="#2A241C"/>
    <rect x="26" y="60" width="90" height="5" rx="2.5" fill="#A59C90"/>
    <rect x="26" y="70" width="60" height="5" rx="2.5" fill="#A59C90" opacity=".7"/>
    <rect x="44" y="96" width="110" height="34" rx="8" fill="#2E2720"/>
    <rect x="54" y="106" width="84" height="5" rx="2.5" fill="#D6CFC3"/>
    <rect x="54" y="116" width="50" height="5" rx="2.5" fill="#D6CFC3" opacity=".7"/>
    <!-- refund button -->
    <rect x="16" y="176" width="138" height="40" rx="8" fill="none" stroke="#C6A36A" stroke-width="1.8" stroke-dasharray="5 4"/>
    <circle cx="44" cy="196" r="11" fill="none" stroke="#C6A36A" stroke-width="1.6"/>
    <path d="M44 189 v14 M40 192 q4 -3 8 0 q-8 4 0 8 q-4 3 -8 0" fill="none" stroke="#C6A36A" stroke-width="1.4"/>
    <rect x="64" y="193" width="70" height="6" rx="3" fill="#C6A36A" opacity=".8"/>
  </g>

  <!-- Arrow into check -->
  <path d="M210 190 H246" stroke="#C6A36A" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- Two policy pages -->
  <g transform="translate(256 62)">
    <!-- old page -->
    <g opacity=".55">
      <rect width="110" height="140" rx="4" fill="#1C1814" stroke="#6B6156"/>
      <rect x="14" y="16" width="60" height="7" rx="3" fill="#6B6156"/>
      <rect x="14" y="36" width="82" height="4" rx="2" fill="#6B6156"/>
      <rect x="14" y="48" width="76" height="4" rx="2" fill="#6B6156"/>
      <rect x="14" y="60" width="82" height="4" rx="2" fill="#6B6156"/>
      <rect x="14" y="72" width="54" height="4" rx="2" fill="#6B6156"/>
      <!-- clock = old -->
      <circle cx="84" cy="112" r="14" fill="none" stroke="#A59C90" stroke-width="1.6"/>
      <path d="M84 104 v8 l6 4" fill="none" stroke="#A59C90" stroke-width="1.6"/>
    </g>
    <!-- current page -->
    <g transform="translate(52 118)">
      <rect width="110" height="140" rx="4" fill="#211C17" stroke="#D6CFC3"/>
      <rect x="14" y="16" width="60" height="7" rx="3" fill="#D6CFC3"/>
      <rect x="14" y="36" width="82" height="4" rx="2" fill="#A59C90"/>
      <rect x="14" y="48" width="76" height="4" rx="2" fill="#A59C90"/>
      <rect x="14" y="60" width="82" height="4" rx="2" fill="#A59C90"/>
      <rect x="14" y="72" width="54" height="4" rx="2" fill="#A59C90"/>
      <circle cx="84" cy="112" r="14" fill="none" stroke="#D6CFC3" stroke-width="1.6"/>
      <path d="M77 112 l5 5 l9 -10" fill="none" stroke="#D6CFC3" stroke-width="1.8"/>
    </g>
    <!-- conflict mark -->
    <g transform="translate(140 96)">
      <circle r="17" fill="#110F0D" stroke="#E5484D" stroke-width="1.6"/>
      <path d="M-8 -3 h16 M-8 4 h16 M5 -9 l-10 18" stroke="#E5484D" stroke-width="1.8" fill="none"/>
    </g>
  </g>

  <!-- Arrow to person -->
  <path d="M430 206 H470" stroke="#C6A36A" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- Person (review) -->
  <g transform="translate(482 136)">
    <rect width="92" height="130" rx="10" fill="#1C1814" stroke="#C6A36A" stroke-width="1.6"/>
    <circle cx="46" cy="46" r="17" fill="none" stroke="#F2EBE0" stroke-width="1.8"/>
    <path d="M18 104 q28 -40 56 0" fill="none" stroke="#F2EBE0" stroke-width="1.8"/>
    <rect x="22" y="112" width="48" height="6" rx="3" fill="#C6A36A"/>
  </g>
</svg>
