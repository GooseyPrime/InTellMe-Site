<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t">
  <title id="t">One original wire story at the center with many news pages branching off it as copies, all counted as a single source</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1612"/>
      <stop offset="1" stop-color="#110F0D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C6A36A" stop-opacity=".22"/>
      <stop offset="1" stop-color="#C6A36A" stop-opacity="0"/>
    </radialGradient>
    <g id="copy">
      <rect x="-26" y="-32" width="52" height="64" rx="3" fill="#1C1814" stroke="#6B6156"/>
      <rect x="-18" y="-24" width="30" height="5" rx="2" fill="#6B6156"/>
      <rect x="-18" y="-12" width="36" height="3" rx="1.5" fill="#4A4239"/>
      <rect x="-18" y="-4" width="32" height="3" rx="1.5" fill="#4A4239"/>
      <rect x="-18" y="4" width="36" height="3" rx="1.5" fill="#4A4239"/>
      <rect x="-18" y="12" width="24" height="3" rx="1.5" fill="#4A4239"/>
    </g>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <g fill="none" stroke="#2A241C" stroke-width="1">
    <path d="M0 100 H600 M0 200 H600 M0 300 H600 M150 0 V400 M300 0 V400 M450 0 V400" opacity=".6"/>
  </g>

  <circle cx="300" cy="200" r="150" fill="url(#glow)"/>

  <!-- Spokes -->
  <g stroke="#6B6156" stroke-width="1.2" stroke-dasharray="3 4">
    <path d="M300 200 L110 80"/><path d="M300 200 L90 200"/><path d="M300 200 L110 320"/>
    <path d="M300 200 L210 50"/><path d="M300 200 L210 350"/>
    <path d="M300 200 L390 50"/><path d="M300 200 L390 350"/>
    <path d="M300 200 L490 80"/><path d="M300 200 L510 200"/><path d="M300 200 L490 320"/>
  </g>

  <!-- Copies -->
  <use href="#copy" x="110" y="80"/>
  <use href="#copy" x="90" y="200"/>
  <use href="#copy" x="110" y="320"/>
  <use href="#copy" x="210" y="50"/>
  <use href="#copy" x="210" y="350"/>
  <use href="#copy" x="390" y="50"/>
  <use href="#copy" x="390" y="350"/>
  <use href="#copy" x="490" y="80"/>
  <use href="#copy" x="510" y="200"/>
  <use href="#copy" x="490" y="320"/>

  <!-- Original -->
  <g transform="translate(300 200)">
    <circle r="66" fill="none" stroke="#C6A36A" stroke-width="1.8"/>
    <rect x="-34" y="-42" width="68" height="84" rx="4" fill="#211C17" stroke="#F2EBE0" stroke-width="1.6"/>
    <rect x="-24" y="-32" width="40" height="7" rx="3" fill="#F2EBE0"/>
    <rect x="-24" y="-17" width="48" height="4" rx="2" fill="#D6CFC3"/>
    <rect x="-24" y="-7" width="42" height="4" rx="2" fill="#D6CFC3"/>
    <rect x="-24" y="3" width="48" height="4" rx="2" fill="#D6CFC3"/>
    <rect x="-24" y="13" width="30" height="4" rx="2" fill="#D6CFC3"/>
    <!-- single-source badge -->
    <g transform="translate(46 -48)">
      <circle r="16" fill="#C6A36A"/>
      <path d="M-3 -7 L2 -9 V9" fill="none" stroke="#110F0D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
